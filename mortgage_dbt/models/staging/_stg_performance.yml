version: 2

models:
  - name: stg_performance
    description: "One row per loan per reporting month, typed from bronze. Grain: loan-month."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - loan_sequence_number
            - monthly_reporting_period
    columns:
      - name: loan_sequence_number
        description: "The unique loan identifier, used to join to origination data."
        tests:
          - not_null
          - relationships:
              to: ref('stg_origination')
              field: loan_sequence_number

      - name: monthly_reporting_period
        tests:
          - not_null

      - name: current_loan_delinquency_status
        description: "The status of the loan's delinquency, represented as a code."
        tests:
          - not_null